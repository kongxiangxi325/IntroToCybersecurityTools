<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lab6 小站 - 操作失败</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="card">
  <h1>Lab6 小站</h1>
  <p>操作失败，请返回重试。</p>
  <section class="panel">
    <h2>本次可能的状态码</h2>
    <p class="tip">打开开发者工具的“网络”面板，查看刚才那次请求的状态码：</p>
    <p class="tip">400：用户名或密码为空，请求本身有误。</p>
    <p class="tip">401：密码错误，未通过验证。</p>
    <p class="tip">409：注册时用户名已存在，发生冲突。</p>
  </section>
  <p><a href="/">返回登录页</a></p>
</main>
</body>
</html>
